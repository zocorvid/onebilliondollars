<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab12</title>
</head>
<body>
<div class="container">
    <h1>Greeting and calculator</h1>
    <label for="name">Enter name:</label>
    <input type="text" id="name">
    <button onclick="greetUser()">Greet me</button>
    <p id="greeting"></p>
    <label for="num1">first number:</label>
    <input type="number" id="num1">
    <label for="num2">second Number:</label>
    <input type="number" id="num2">
    <p>Choose an operation:</p>
    <input type="radio" name="operation" value="add" checked>Addition<br>
    <input type="radio" name="operation" value="subtract">Subtraction<br>
    <input type="radio" name="operation" value="multiply">Multiplication<br>
    <input type="radio" name="operation" value="divide">Division<br><br>
    <button onclick="calculate()">Calculate</button>
    <button onclick="clearScreen()">Clear</button>
    <div id="result"></div>
</div>
<script>
    function greetUser() {
        const name=document.getElementById("name").value;
        if(name.trim() === "") {
            document.getElementById("greeting").textContent =
                "Please enter your name";
        } else{
            document.getElementById("greeting").textContent =
                "Hello, "+name+", welcome to the calculator!";
        }
    }
    function calculate() {
        const num1=parseFloat(document.getElementById("num1").value);
        const num2=parseFloat(document.getElementById("num2").value);
        if(isNaN(num1) || isNaN(num2)) {
            document.getElementById("result").textContent =
                "Please enter both numbers";
            return;
        }
        const operation =
            document.querySelector('input[name="operation"]:checked').value;
        let result;
        switch (operation) {
            case "add":
                result= num1+num2;
                break;
            case "subtract":
                result=num1-num2;
                break;
            case "multiply":
                result= num1*num2;
                break;
            case "divide":
                if (num2 === 0) {
                    document.getElementById("result").textContent =
                        "Error: can't divide by zero";
                    return;
                }
                result=num1/num2;
                break;
        }
        document.getElementById("result").textContent =
            "Result: " + result;
    }
    function clearScreen() {
        document.getElementById("name").value = "";
        document.getElementById("num1").value = "";
        document.getElementById("num2").value = "";
        document.getElementById("greeting").textContent = "";
        document.getElementById("result").textContent = "";
        document.querySelector('input[value="add"]').checked = true;
    }
</script>
</body>
</html>
