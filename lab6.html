<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab 6 -flexbox</title>
    <style>
        *{
            box-sizing:border-box;
        }
        .flex-parent{
            border:1px solid;
            height:100vh;
            align-items:center;
            justify-content:center;
            display: flex;
            align-items:center;
        }
        .child{
            padding: 10px;
            box-sizing: border-box;
        }
        .child {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="flex-parent">
        <div class="child"><img src="https://picsum.photos/150/150?random=1" alt="image 1"></div>
        <div class="child"><img src="https://picsum.photos/200/200?random=2" alt="image 2"></div>
        <div class="child"><img src="https://picsum.photos/150/150?random=3" alt="image 3"></div>
    </div>
</html>
