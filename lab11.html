<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab11</title>
    <style>
        #box {
            background-color: blue;
            color: rgb(255, 166, 0);
            border-radius: 25%;
            padding:3px;
            text-align:center;
            width:200px;
        }
        #movemouse {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 75vh;
            background-color: white;
        }
    </style>
</head>
<body>
    <p id="box">Click Me! 😊</p>
    <div id="movemouse"></div>
    <script>
    const box = document.getElementById("box");
    function hover(event) {
        box.style.backgroundColor = "yellow"
        box.textContent = "Do not click! 😠"
    }
    function singleClick(event) {
        box.style.backgroundColor = "red"
        box.textContent = "Ouch! 🤕"
    }
    function leave(event) {
        box.style.backgroundColor = "lightgreen"
        box.textContent = "Phew! 😌"
    }
    function doubleClick(event) {
        box.style.backgroundColor = "pink"
        box.textContent = "Double trouble! 🤩"
    }
    function move(event) {
        box.style.backgroundColor = "lightblue"
        box.textContent = "I see you! 👀"
    }
    box.addEventListener("mouseover", hover);
    box.addEventListener("click", singleClick);
    box.addEventListener("mouseout", leave);
    box.addEventListener("dblclick", doubleClick);
    document.getElementById("movemouse").addEventListener("mousemove", move);
    </script>
</body>
</html>
